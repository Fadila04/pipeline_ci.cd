name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python pour les tests backend
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

        # Étape Ruff (format code)
      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check .
          
      # 3. Installer dépendances backend
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest

      # 4. Lancer les tests backend
      - name: Run backend tests
        run: |
          cd backend
          pytest --maxfail=1 --disable-warnings -q

      # 5. Déployer la documentation MkDocs
      - name: Install MkDocs deps
        run: pip install mkdocs mkdocs-material

      - name: Deploy MkDocs to GitHub Pages
        working-directory: docs
        run: mkdocs gh-deploy --force

      # 6. Connexion à DockerHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Construction image Backend
      - name: Build backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest backend/

      # 8. Construction image Frontend
      - name: Build frontend Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest frontend/

      # 9. Push sur DockerHub
      - name: Push backend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
